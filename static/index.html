<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover your next favorite movie with our AI-powered recommendation engine.">
    <title>CineMatch | AI Movie Recommendations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header>
            <h1 class="logo">CineMatch</h1>
            <p class="subtitle">Discover your next favorite movie.</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="movie-input" placeholder="Enter a movie you love..." autocomplete="off">
                <button id="search-btn" aria-label="Search">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            <div id="error-message" class="error-message hidden"></div>
        </section>

        <section id="results-section" class="results-section hidden">
            <h2>Because you liked <span id="searched-movie" class="highlight"></span></h2>
            <div class="recommendations-grid" id="recommendations-grid">
                <!-- Movie cards will be inserted here dynamically -->
            </div>
        </section>
        
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Analyzing movies...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
